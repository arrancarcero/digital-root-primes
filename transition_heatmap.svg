<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" width="660" height="500" role="img">
<title>Digital-root transitions of consecutive primes</title>
<desc>Heatmap for the first 1,000 primes. A root is rarely followed by the same root; the most common transitions correspond to prime gaps of 2, 4 and 6.</desc>
